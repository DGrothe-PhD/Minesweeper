name: lint-mindsweeper

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Date Setup (MM/DD/YYYY)
        id: date
        run: echo "today=$(date +'%m/%d/%Y')" >> "$GITHUB_OUTPUT"

      # 1) Install pnpm before setup-node cache
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # 2) Setup Node.js with pnpm cache
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 3) Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4) Run ESLint (warn-only)
      - name: Run ESLint
        run: pnpm exec eslint src --ext .js,.jsx,.ts,.tsx --cache --quiet || true

      # 5) Run Prettier (warn-only, summary)
      - name: Run Prettier (warn-only)
        run: |
          if ! pnpm exec prettier --list-different . > /tmp/prettier_diff.txt; then
            echo "## Prettier Differences" >> $GITHUB_STEP_SUMMARY
            cat /tmp/prettier_diff.txt >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      # 6) Stylelint summary output
      - name: Stylelint Summary Output
        run: |
          echo "## Stylelint Results" >> $GITHUB_STEP_SUMMARY
          pnpm exec stylelint "**/*.{css,scss}" >> $GITHUB_STEP_SUMMARY || true
name: lint-job

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Install pnpm before setup-node configures the pnpm cache
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # 3) Set up Node.js 20 and enable pnpm dependency caching
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # 4) Install dependencies exactly as defined in pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5) Run ESLint and add the results to the job summary
      - name: Run ESLint
        continue-on-error: true
        run: |
          pnpm exec eslint src \
            --ext .js,.jsx,.ts,.tsx \
            --cache \
            --quiet \
            2>&1 | tee /tmp/eslint-results.txt

          echo "## ESLint Results" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/eslint-results.txt ]; then
            cat /tmp/eslint-results.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ESLint errors found." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 6) Check Prettier formatting and list differences in the job summary
      - name: Run Prettier
        continue-on-error: true
        run: |
          pnpm exec prettier \
            --list-different . \
            2>&1 | tee /tmp/prettier-results.txt

          echo "## Prettier Differences" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/prettier-results.txt ]; then
            cat /tmp/prettier-results.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Prettier differences found." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 7) Run Stylelint and add the results to the job summary
      - name: Run Stylelint
        continue-on-error: true
        run: |
          pnpm exec stylelint \
            "**/*.{css,scss}" \
            2>&1 | tee /tmp/stylelint-results.txt

          echo "## Stylelint Results" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/stylelint-results.txt ]; then
            cat /tmp/stylelint-results.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Stylelint errors found." >> "$GITHUB_STEP_SUMMARY"
          fi
